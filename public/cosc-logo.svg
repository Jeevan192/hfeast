<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Exact dark teal background matching the COSC logo image -->
    <linearGradient id="sqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1E1A"/>
      <stop offset="100%" stop-color="#101F1C"/>
    </linearGradient>
    <!-- Light mint/teal letter gradient -->
    <linearGradient id="ltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4DCD6"/>
      <stop offset="100%" stop-color="#8BBCB4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square — matches the user's logo exactly -->
  <rect width="100" height="100" rx="15" ry="15" fill="url(#sqBg)"/>

  <!-- Outer border ring -->
  <rect x="3" y="3" width="94" height="94" rx="13" ry="13"
        fill="none" stroke="#2A4E46" stroke-width="2"/>

  <!-- 4-cell grid lines (creates the CO/SC grid effect) -->
  <!-- Horizontal centre -->
  <line x1="6"  y1="50" x2="94" y2="50"
        stroke="rgba(180, 210, 205, 0.18)" stroke-width="1"/>
  <!-- Vertical centre -->
  <line x1="50" y1="6"  x2="50" y2="94"
        stroke="rgba(180, 210, 205, 0.18)" stroke-width="1"/>

  <!-- "CO" top half -->
  <text
    x="50" y="40"
    font-family="'Space Grotesk', 'Outfit', 'Inter', Arial Black, sans-serif"
    font-size="30"
    font-weight="800"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="url(#ltGrad)"
    letter-spacing="3">CO</text>

  <!-- "SC" bottom half -->
  <text
    x="50" y="68"
    font-family="'Space Grotesk', 'Outfit', 'Inter', Arial Black, sans-serif"
    font-size="30"
    font-weight="800"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="url(#ltGrad)"
    letter-spacing="3">SC</text>
</svg>
